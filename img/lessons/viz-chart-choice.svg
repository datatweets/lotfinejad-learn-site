<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img"><title>کدام نمودار؟</title><defs><marker id="ah059669" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah2563eb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah7c3aed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ahd97706" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="760" height="360" fill="#ffffff"/><text x="380" y="28" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Vazirmatn, Tahoma, 'Geeza Pro', 'Segoe UI', Arial, sans-serif" direction="rtl" unicode-bidi="embed">سوال تان چیست؟ همان نوع نمودار را تعیین می کند</text><rect x="575" y="60" width="160" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="655" y="94" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Vazirmatn, Tahoma, 'Geeza Pro', 'Segoe UI', Arial, sans-serif" direction="rtl" unicode-bidi="embed">تغییر در زمان</text><line x1="655" y1="118" x2="655" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#ah2563eb)"/><rect x="575" y="154" width="160" height="96" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="655" y="188" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Vazirmatn, Tahoma, 'Geeza Pro', 'Segoe UI', Arial, sans-serif" direction="rtl" unicode-bidi="embed">نمودار خطی</text><text x="655" y="220" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" direction="ltr">plot()</text><rect x="395" y="60" width="160" height="56" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/><text x="475" y="94" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Vazirmatn, Tahoma, 'Geeza Pro', 'Segoe UI', Arial, sans-serif" direction="rtl" unicode-bidi="embed">رابطه ی دو عدد</text><line x1="475" y1="118" x2="475" y2="150" stroke="#059669" stroke-width="2" marker-end="url(#ah059669)"/><rect x="395" y="154" width="160" height="96" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="475" y="188" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Vazirmatn, Tahoma, 'Geeza Pro', 'Segoe UI', Arial, sans-serif" direction="rtl" unicode-bidi="embed">نمودار پراکندگی</text><text x="475" y="220" font-size="14" fill="#059669" text-anchor="middle" font-weight="700" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" direction="ltr">scatter()</text><rect x="215" y="60" width="160" height="56" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="295" y="94" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Vazirmatn, Tahoma, 'Geeza Pro', 'Segoe UI', Arial, sans-serif" direction="rtl" unicode-bidi="embed">مقایسه ی دسته ها</text><line x1="295" y1="118" x2="295" y2="150" stroke="#d97706" stroke-width="2" marker-end="url(#ahd97706)"/><rect x="215" y="154" width="160" height="96" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="295" y="188" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Vazirmatn, Tahoma, 'Geeza Pro', 'Segoe UI', Arial, sans-serif" direction="rtl" unicode-bidi="embed">نمودار میله ای</text><text x="295" y="220" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" direction="ltr">bar()</text><rect x="35" y="60" width="160" height="56" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="115" y="94" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Vazirmatn, Tahoma, 'Geeza Pro', 'Segoe UI', Arial, sans-serif" direction="rtl" unicode-bidi="embed">شکل توزیع یک عدد</text><line x1="115" y1="118" x2="115" y2="150" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah7c3aed)"/><rect x="35" y="154" width="160" height="96" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="115" y="188" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Vazirmatn, Tahoma, 'Geeza Pro', 'Segoe UI', Arial, sans-serif" direction="rtl" unicode-bidi="embed">هیستوگرام</text><text x="115" y="220" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" direction="ltr">hist()</text><text x="380" y="290" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Vazirmatn, Tahoma, 'Geeza Pro', 'Segoe UI', Arial, sans-serif" direction="rtl" unicode-bidi="embed">برای مقایسه ی چند گروه: میله ای.  برای دیدن روند: خطی.  برای دیدن الگو: پراکندگی.</text><text x="380" y="320" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Vazirmatn, Tahoma, 'Geeza Pro', 'Segoe UI', Arial, sans-serif" direction="rtl" unicode-bidi="embed">اگر داده را نمی شناسید، با هیستوگرام شروع کنید</text></svg>