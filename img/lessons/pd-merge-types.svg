<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img"><title>انواع اتصال: inner، left، right، outer</title><defs></defs><rect width="760" height="330" fill="#ffffff"/><defs><clipPath id="cl0"><circle cx="76" cy="130" r="48"/></clipPath></defs><circle cx="76" cy="130" r="48" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><circle cx="124" cy="130" r="48" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><circle cx="124" cy="130" r="48" fill="#93c5fd" stroke="#2563eb" stroke-width="2" clip-path="url(#cl0)"/><text x="48" y="135" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" direction="ltr">L</text><text x="152" y="135" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" direction="ltr">R</text><text x="100" y="220" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" direction="ltr">how='inner'</text><text x="100" y="246" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Vazirmatn, Tahoma, 'Geeza Pro', 'Segoe UI', Arial, sans-serif" direction="rtl" unicode-bidi="embed">فقط مشترک ها</text><defs><clipPath id="cl1"><circle cx="263" cy="130" r="48"/></clipPath></defs><circle cx="263" cy="130" r="48" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="311" cy="130" r="48" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><circle cx="311" cy="130" r="48" fill="#93c5fd" stroke="#2563eb" stroke-width="2" clip-path="url(#cl1)"/><text x="235" y="135" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" direction="ltr">L</text><text x="339" y="135" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="'SF Mono', Menl